# Netlify configuration for frotzsmith
# Static Nuxt 4 build (ssr: false). On Netlify, Nitro's Netlify preset writes the
# static site to `dist` (locally `dist` is a symlink to `.output/public`), so we
# publish `dist`. Headers/CSP: see the [[headers]] notes below and docs/06-security.md §9.

[build]
  # Install from yarn.lock exactly (audit 2026-11-04, F16). Netlify runs its
  # own `yarn install $YARN_FLAGS` BEFORE this command, and that install is
  # not frozen by default — it would rewrite a drifted lockfile, and the
  # frozen install below would then pass. YARN_FLAGS (below) freezes
  # Netlify's own install; the explicit one stays as a second check (cached).
  command = "yarn install --frozen-lockfile && yarn generate"
  publish = "dist"
  # A production deploy costs Netlify credits; a Deploy Preview does not. Skip the
  # build when a push changes only files the site is not built from, so a README or
  # docs commit to main doesn't spend a production deploy. Netlify skips when this
  # exits 0 and builds otherwise. The first test always builds when there is no
  # previous deploy to compare with (Netlify sets CACHED_COMMIT_REF to COMMIT_REF
  # then, the diff would be empty, and the deploy would be skipped).
  # Not built from: README.md, ROADMAP.md (the app only links to them), docs/ and
  # .github/. CHANGELOG.md is NOT excluded: a release always changes it alongside
  # package.json, and it is cheap to be wrong in the direction of building.
  ignore = "test \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" && exit 1; git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- . \":(exclude)README.md\" \":(exclude)ROADMAP.md\" \":(exclude)docs\" \":(exclude).github\""

[build.environment]
  NODE_VERSION = "22"
  YARN_FLAGS = "--frozen-lockfile"

# NOTE on redirects: on Netlify this build runs Nitro's netlify preset, which
# emits its own `_redirects` catch-all — [[redirects]] blocks here are
# SHADOWED by it and never match (verified live 2026-07-09; headers below DO
# apply). Custom rules therefore live in `public/_redirects` (the Plausible
# first-party proxy), where Nitro appends its catch-all after them.

# Security headers, tuned so the in-browser toolchain actually works. Every
# loose source is explained in docs/06-security.md §9 and pinned by
# tools/netlify-headers.test.ts:
#  - X-Frame-Options SAMEORIGIN: the IDE embeds the Parchment player in a
#    same-origin <iframe> (DENY would block it).
#  - 'wasm-unsafe-eval': inform6.wasm and the .NET ZILF runtime.
#  - 'unsafe-eval': the ZVM player is a JIT (compiles z-code to JS at
#    runtime), and the replay worker evals the sloppy-mode glkapi.js.
#  - 'unsafe-inline' (scripts): the player page's inline init and Nuxt's
#    inline SPA bootstrap; (styles) Nuxt UI + the player's inline styles.
#  - connect-src blob:: Parchment fetch()es the compiled story from a blob URL.
#  - blob: was dropped from script-src, worker-src, frame-src and child-src
#    (audit 2026-11-04, F11): nothing loads a blob script, worker or frame
#    (workers are same-origin module files; blob URLs are only fetched or used
#    as <a download> targets). Verified in Chrome with a report-uri: I6 compile,
#    Play, headless replay, ZIL compile and Play raised no violation.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    # Review 2026-11-09. HSTS stated here, so the custom domain sends includeSubDomains too
    # (Netlify's own header there is max-age only). No `preload`: that is a decision for the
    # whole of frotzinc.com, not this site. COOP: no other site's window keeps a handle on
    # the IDE (it opens no popups that need one; outbound links are rel=noopener).
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' blob:; worker-src 'self'; frame-src 'self'; child-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"

# The service worker and the web manifest are unfingerprinted and are how a
# browser learns of a new deploy: always revalidated. (workbox-*.js is
# content-hashed and needs nothing.)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    # Netlify serves the .webmanifest extension as application/octet-stream.
    Content-Type = "application/manifest+json"

# Long-cache content-hashed build assets (WASM, interpreter, JS/CSS).
[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# EXCEPT Nuxt's app manifest: it is unfingerprinted (builds/latest.json, and
# builds/meta/<id>.json read by the route-rules middleware), so it must never
# be immutable-cached. Nuxt's own polling of it to detect new deploys is OFF
# (nuxt.config.ts experimental.checkOutdatedBuildInterval: false — it reloads
# the page by itself); the service worker finds new deploys and only offers
# them. (Later rules override earlier ones on Netlify.)
[[headers]]
  for = "/_nuxt/builds/*"
  [headers.values]
    Cache-Control = "no-cache"

# The .NET ZILF bundle lives under a compiler-revision path
# (/zilf/r<rev>/_framework, see ZILF_FRAMEWORK_BASE), so it can be immutable:
# a rebuild lands under a new path and propagates instantly, and the old
# stale-dotnet.js → SPA-fallback cache-poisoning edge is gone.
[[headers]]
  for = "/zilf/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Vendored Parchment player assets: unfingerprinted but change rarely; a week
# of caching kills the ~6 conditional round-trips on every compile→play.
[[headers]]
  for = "/play/web/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
