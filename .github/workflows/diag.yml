# TEMPORARY: why do the ZILF goldens run slower on CI under vitest 3+? Removed before merge.
name: diag
on:
  push:
    branches: [deps/vitest-5]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ZIL_SAMPLE_GOLDEN: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: nproc; free -m; node -v; node -e "console.log(require('os').cpus()[0].model, require('os').availableParallelism())"
      - name: v5 alone
        run: npx vitest run app/modules/zil/mingus-2.golden.test.ts app/project-package/container.test.ts --reporter=verbose 2>&1 | grep -aE "diag|ratio limit|Test Files|Duration|FAIL|timed out" || true
      - name: v5 alone, one worker
        run: npx vitest run app/modules/zil/mingus-2.golden.test.ts --maxWorkers=1 --reporter=verbose 2>&1 | grep -aE "diag|Test Files|Duration|FAIL|timed out" || true
      - name: v5 three ZIL goldens at once
        run: npx vitest run app/modules/zil/mingus-2.golden.test.ts app/modules/zil/mingus-1.golden.test.ts app/modules/zil/architect-legacy.golden.test.ts app/project-package/container.test.ts --reporter=verbose 2>&1 | grep -aE "diag|ratio limit|Test Files|Duration|FAIL|timed out|golden.test.ts \(" || true
      - name: v5 worker facts
        run: |
          cat > /tmp/facts.test.ts <<'T'
          import { test } from 'vitest'
          import v8 from 'node:v8'
          test('facts', () => { console.log('[diag] execArgv', JSON.stringify(process.execArgv), 'argv0', process.argv0, 'heap', Math.round(v8.getHeapStatistics().heap_size_limit / 1048576), 'NODE_OPTIONS', process.env.NODE_OPTIONS, 'isMain', typeof process.send) })
          T
          cp /tmp/facts.test.ts tools/facts.test.ts && npx vitest run tools/facts.test.ts 2>&1 | grep -a diag || true
      - name: switch to vitest 2.1.9
        run: yarn add -D vitest@2.1.9 @vitest/coverage-v8@2.1.9 2>&1 | tail -2
      - name: v2 worker facts
        run: npx vitest run tools/facts.test.ts 2>&1 | grep -a diag || true
      - name: v2 alone
        run: npx vitest run app/modules/zil/mingus-2.golden.test.ts app/project-package/container.test.ts --reporter=verbose 2>&1 | grep -aE "diag|ratio limit|Test Files|Duration|FAIL|timed out" || true
      - name: v2 three ZIL goldens at once
        run: npx vitest run app/modules/zil/mingus-2.golden.test.ts app/modules/zil/mingus-1.golden.test.ts app/modules/zil/architect-legacy.golden.test.ts app/project-package/container.test.ts --reporter=verbose 2>&1 | grep -aE "diag|ratio limit|Test Files|Duration|FAIL|timed out|golden.test.ts \(" || true
